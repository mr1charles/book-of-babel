name: Smiley hunt
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: cd smiley && npm install --no-audit --no-fund
      - name: Search until a smiley appears (real run)
        run: cd smiley && node search.mjs
      - name: Render video of the run
        run: cd smiley && node render-video.mjs
      - uses: actions/upload-artifact@v4
        with: { name: smiley-run, path: smiley/out }
      - name: Publish result to the site
        run: |
          mkdir -p smiley/result && cp smiley/out/result.json smiley/out/smiley.mp4 smiley/result/
          git config user.name mr1charles && git config user.email "181485605+mr1charles@users.noreply.github.com"
          git add smiley/result && git commit -m "Smiley hunt result" && git push
