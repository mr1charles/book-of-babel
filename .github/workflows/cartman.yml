name: Cartman hunt (timed)
on:
  workflow_dispatch:
    inputs: { seconds: { description: 'how long to try', default: '90' } }
permissions: { contents: write }
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: cd smiley && npm install --no-audit --no-fund
      - name: Random 15x15 pictures for N seconds (real run)
        run: cd smiley && node image-search.mjs ${{ inputs.seconds }}
      - name: Render the TikTok video (v1 format)
        run: cd smiley && node render-cartman.mjs out/cartman-result.json out/v1-cartman.mp4
      - uses: actions/upload-artifact@v4
        with: { name: cartman-run, path: smiley/out }
      - name: Publish result to the site
        run: |
          rm -rf smiley/cartman && mkdir -p smiley/cartman && cp smiley/out/cartman-result.json smiley/out/v1-cartman.mp4 smiley/cartman/
          git config user.name mr1charles && git config user.email "181485605+mr1charles@users.noreply.github.com"
          git add smiley/cartman && git commit -m "Cartman hunt result" && git push
